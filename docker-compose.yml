# Alpacode · Segnala un amico — behind lucaslorentz/caddy-docker-proxy,
# exactly like alpacode-website (same external "caddy" network).
#
# Deploy:  cp .env.example .env  (fill it in)  &&  docker compose up -d --build
# Domain:  SITE_DOMAIN (defaults to voucher.alpacode.it); DNS first, so
#          Let's Encrypt can issue the certificate.

networks:
  caddy:
    external: true

volumes:
  referral-data:

services:
  alpacode-voucher:
    build:
      context: .
      args:
        SITE_URL: "${SITE_URL:-https://voucher.alpacode.it}"
    image: alpacode-voucher:latest
    container_name: alpacode-voucher
    restart: unless-stopped
    networks:
      - caddy
    expose:
      - "4321"
    volumes:
      - referral-data:/app/data
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: "production"
      SITE_URL: "${SITE_URL:-https://voucher.alpacode.it}"
      REFERRAL_SECRET: "${REFERRAL_SECRET:-}"
      REFERRAL_LEDGER: "${REFERRAL_LEDGER:-/app/data/referrals.jsonl}"
      REFERRAL_CONFIRM_EMAILS: "${REFERRAL_CONFIRM_EMAILS:-0}"
      # Email via AWS SES — optional. Without AWS_REGION submissions are
      # logged (docker compose logs alpacode-voucher) and kept in the ledger.
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-info@alpacode.it}"
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL:-info@alpacode.it}"
    labels:
      caddy: "${SITE_DOMAIN:-voucher.alpacode.it}"
      caddy.reverse_proxy: "{{upstreams 4321}}"
      caddy.encode: "zstd gzip"
      caddy.header.X-Content-Type-Options: "nosniff"
      caddy.header.Referrer-Policy: "strict-origin-when-cross-origin"
      caddy.header.X-Frame-Options: "SAMEORIGIN"
      caddy.header.Permissions-Policy: "geolocation=(), camera=(), microphone=()"
      caddy.header.Strict-Transport-Security: "max-age=31536000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
