# Type-check + build on every push and PR (same gate as alpacode-website).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # keep in sync with the Dockerfile
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
